<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Aplication Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="#" method="POST" class="application-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="position">Position:</label>
            <select id="position" name="position" required>
                <option value="">Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>
        </form>
        <fieldset class="radio-group">
            <legend>Availability:</legend>
            <input type="radio" id="full-time" name="availability" value="full-time" required checked>
            <label for="full-time">Full-time</label>
            <input type="radio" id="part-time" name="availability" value="part-time" required>
            <label for="part-time">Part-time</label>
        </fieldset>      
        <p><label for="message">Why do you want this job?</label></p>
        <textarea id="message" name="message" placeholder="Write your motivation" required></textarea>
        <button class="submit-btn" type="submit">Submit Application</button>
    </div>
</body>
</html>
